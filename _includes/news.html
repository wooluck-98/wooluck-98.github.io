<!-- News Section -->
<section class="section-muted" id="news">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>News</h2>
        <hr class="star-primary">
      </div>
    </div>
    <div class="row">
      <div class="col-lg-8 col-lg-offset-2">
        {% assign news_items = site.data.news %}
        {% if news_items and news_items.size > 0 %}
        <div class="timeline-list">
          {% for item in news_items %}
          <article class="timeline-item">
            <time>{{ item.date }}</time>
            <div>
              <h3>{{ item.title }}</h3>
              {% if item.description %}
              <p>{{ item.description }}</p>
              {% endif %}
            </div>
          </article>
          {% endfor %}
        </div>
        {% else %}
        <p class="section-empty">News will be updated soon.</p>
        {% endif %}
      </div>
    </div>
  </div>
</section>
